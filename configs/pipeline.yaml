# =============================================================================
# Schweiß-KI Pipeline Konfiguration
# AP2.1 - Optimierter Datenfluss: STEP → Segmentierte Punktwolke
# AP2.2 - Subtraktionsmethode: Scan ↔ CAD Vergleich
# =============================================================================
# Phasen:
#   Phase 1 (KW 06-08): CAD-Konvertierung + WeldVolumeModel         ← abgeschlossen
#   Phase 2 (KW 09-11): Preprocessing                               ← aktiv
#   Phase 3 (KW 10-15): Segmentierung (RANSAC)                      ← aktiv
#   Phase 4 (KW 13-14): Segmentierung (PointNet) - optional         ← noch nicht aktiv
#   Phase 5 (KW 15-…):  Subtraktion (Registrierung + Differenz)     ← aktiv
# =============================================================================

# Eingabeverzeichnis mit STEP-Dateien
input_dir: data/synthetic/test_step_files

# Output-Konfiguration
output:
  output_dir: data/outputs
  save_model: true
  save_intermediate: false   # Zwischenschritte speichern (für Debugging)


# ── Stage 1: CAD-Konvertierung ────────────────────────────────────────────────
# STEP → Punktwolke via Michel's API
# Status: aktiv (Phase 1)
# -----------------------------------------------------------------------------
cad_conversion:
  enabled: true
  target_point_spacing: 0.2     # mm – mittlerer Punktabstand auf der CAD-Oberfläche.
                                # null = API-Default. Punktanzahl wird automatisch aus
                                # surface_area abgeleitet (point_count = area / spacing²).
                                # Faustregel: spacing ≤ Toleranz (0.25 mm) für sinnvolle
                                # Distanz-Auflösung mit lokaler Ebenenprojektion.

# ── Stage 2: Preprocessing ───────────────────────────────────────────────────
# Konfigurierbare Chain zur Aufbereitung von Punktwolken.
# Status: aktiv (Phase 2)
#
# Aufbau:
#   enabled:                   Globaler Ein-/Ausschalter für die gesamte Stage
#   source_type_overrides:     Überschreiben einzelne Step-Parameter je nach
#                              WeldVolumeModel.source_type ("ideal"/"real"/"synthetic")
#   steps:                     Globale Defaults – Reihenfolge = Ausführungsreihenfolge
#
# Alle Längenwerte in mm.
# Parameter werden mit realen Scandaten von Heidenbluth validiert und angepasst.
# -----------------------------------------------------------------------------
preprocessing:
  enabled: true             # ← auf true setzen wenn Pipeline-Integration fertig

  # ── Source-Type-Overrides ──────────────────────────────────────────────────
  # WeldVolumeModel.source_type bestimmt automatisch welcher Override aktiv ist.
  source_type_overrides:

    ideal:
      # CAD-Punktwolken (von Michel's API) sind sauber – Outlier-Filter nicht nötig
      statistical_outlier_filter:
        enabled: false
      radius_outlier_filter:
        enabled: false
      # Voxel-Downsampling trotzdem für konsistente Dichte, aber feiner
      voxel_grid_downsampler:
        voxel_size: 0.3

    synthetic:
      # Synthetisches Rauschen ist kontrolliert – weniger aggressives Filtering
      statistical_outlier_filter:
        std_ratio: 3.0

    real:
      # Reale Scandaten: alle Filter aktiv
      # Parameter werden nach Eingang der Heidenbluth-Scans validiert
      statistical_outlier_filter:
        enabled: true
      radius_outlier_filter:
        enabled: true

  # ── Steps (globale Defaults) ───────────────────────────────────────────────
  # Reihenfolge der Schlüssel = Ausführungsreihenfolge der Pipeline.

  steps:

    # 1. Statistischer Ausreißerfilter
    #    Entfernt Punkte deren mittlere kNN-Distanz weit vom Durchschnitt abweicht.
    #    Zuerst ausführen: grobe Fehler vor feinerer Verarbeitung entfernen.
    statistical_outlier_filter:
      enabled: true
      nb_neighbors: 20    # Anzahl Nachbarn für Distanzberechnung
      std_ratio: 2.0      # Schwellwert in Standardabweichungen (kleiner = aggressiver)

    # 2. Radius-Ausreißerfilter
    #    Entfernt isolierte Einzelpunkte (potenzielle Spritzer-Kandidaten).
    #    Deaktiviert by default – erst sinnvoll mit realen Scandaten.
    radius_outlier_filter:
      enabled: true
      min_nb_points: 3       # Mindestanzahl Nachbarn im Radius
      search_radius: 2.0         # Suchradius in mm

    # 3. Voxel-Grid-Downsampling
    #    Gleichmäßige Punktdichte über die gesamte Punktwolke.
    #    voxel_size abhängig von Scanner-Auflösung – nach Erhalt der Heidenbluth-Scans anpassen.
    voxel_grid_downsampler:
      enabled: true
      voxel_size: 0.5     # Voxelgröße in mm (Faustregel: 2-3× mittlerer Punktabstand)

    # 4. Normalenschätzung
    #    Berechnet Oberflächennormalen – Voraussetzung für RANSAC-Segmentierung (Phase 4).
    normal_estimator:
      enabled: true
      radius: 2.0
      max_nn: 30
      orient_mode: camera
      scan_origin: [0.0, 0.0, 100.0]   # 100mm über dem Werkstück (Scanner-Position)


# ── Stage 3: Segmentierung ───────────────────────────────────────────────────
# Klassifikation der Punkte in semantische Regionen.
# Status: aktiv (Phase 3)
#
# Labels:
#   0 = background          (Werkstück-Oberseite, Umgebung, Artefakte außerhalb Naht)
#   1 = flank_a             (V-Fase auf negativer gap_axis-Seite, n[gap_axis] > 0)
#   2 = flank_b             (V-Fase auf positiver gap_axis-Seite, n[gap_axis] < 0)
#   3 = gap_region          (Freier Raum zwischen den Fasen)
#   4 = sub_gap_artifacts   (Punkte unterhalb Flanken-Unterkante, z.B. Durchstich)
#
# Achsen-Konvention (identisch zur Subtraktions-Stage weiter unten):
#   seam_axis     = 0 (X) – Naht-Längsrichtung
#   gap_axis      = 1 (Y) – Spalt-Querrichtung
#   vertical_axis = 2 (Z) – Tiefe
# Muss zur tatsächlichen Lage der Naht passen, sonst findet der
# flank_segmenter 0 Kandidaten (Symptom: alles wird Label 0).
# -----------------------------------------------------------------------------
segmentation:
  enabled: true

  steps:
    # 1. Werkstück-Oberseite als Background entfernen
    background_remover:
      enabled: true
      ransac_threshold: 0.25         # mm (= Toleranzanforderung AP2)
      max_iterations: 1000
      ransac_n: 3
      expected_normal: [0.0, 0.0, 1.0]
      normal_cos_threshold: 0.95     # cos(~18°)

    # 2. V-Fasen segmentieren (zweimal RANSAC, signed Normalen-Filter)
    flank_segmenter:
      enabled: true
      ransac_threshold: 0.25
      max_iterations: 1000
      ransac_n: 3
      expected_flank_angle_deg: 45.0  # Flanke zur Vertikalen (90° V-Naht)
      normal_cos_threshold: 0.85      # lenient: ±32° Abweichung zugelassen
      seam_axis: 0                    # 0=X – Naht-Längsrichtung
      gap_axis: 1                     # 1=Y – Flanken-Normalen zeigen entlang ±Y
      vertical_axis: 2                # 2=Z – Tiefe

    # 3. Rest zwischen Flanken als Gap / Sub-Gap-Artefakte klassifizieren
    gap_classifier:
      enabled: true
      z_lower_quantile: 0.05
      gap_margin: 0.5
      separate_sub_gap_artifacts: true
      gap_width_bins: 20
      seam_axis: 0
      gap_axis: 1
      vertical_axis: 2


# ── Stage 4: Subtraktion (AP2.2) ─────────────────────────────────────────────
# Vergleich segmentierter Scan-Wolke gegen CAD-Referenz.
# Status: aktiv (Phase 5)
#
# Ablauf:
#   1. Registrierung: Scan in CAD-Koordinatensystem überführen (CoarsePCA → ICPFine)
#   2. Deviation: Geometrische Abweichungen quantifizieren (GapProfile, ...)
#
# Reihenfolge der Schlüssel innerhalb von 'steps:' = Ausführungsreihenfolge.
# -----------------------------------------------------------------------------
subtraction:
  enabled: true

  # ── Registrierung ──────────────────────────────────────────────────────────
  registration:
    steps:

      # 1. Grob-Registrierung via PCA
      #    Richtet Hauptachsen aufeinander aus, löst Vorzeichen-Ambiguität
      #    über vier Kandidaten-Auswertungen. Liefert Init für ICP.
      coarse_pca:
        enabled: true
        anchor_labels: [0, 1, 2]      # Background + Flanken, ohne Spalt
        evaluation_samples: 5000      # Source-Subsample für Kandidaten-Ranking
        random_seed: 0

      x_edge_align:
        enabled: true
        bin_width_mm: 0.5
        min_points_per_bin: 20
        anchor_labels: [0, 1, 2]      

      # 2. Fein-Registrierung via Point-to-Plane ICP
      #    Korrigiert den Translations-Rest, den PCA prinzipbedingt nicht löst
      #    (V-Naht ist über die Längsrichtung rotationssymmetrisch).
      icp_fine:
        enabled: true
        max_correspondence_distance: 1.0   # mm – Maximaler NN-Abstand für Korrespondenzen
        max_iteration: 50
        relative_fitness: 1.0e-6           # Konvergenzschwelle Fitness-Änderung
        relative_rmse: 1.0e-6              # Konvergenzschwelle RMSE-Änderung
        anchor_labels: [0, 1, 2]
        evaluation_samples: 5000
        random_seed: 0

  # ── Differenzanalyse ───────────────────────────────────────────────────────
  deviation:
    tolerance_mm: 0.25     # Globale Toleranzschwelle für In-/Out-of-Tolerance-Bewertung

    steps:

      # Allgemeine Punkt-zu-CAD-Distanz mit globalen und per-Label-Aggregaten
      # Bauteilunabhängig – Basis für AP2.2-Validierung.
      point_distance:
        enabled: true
        max_distance: 5.0   # mm – Punkte mit |d| > max_distance werden als
                            # Ausreißer behandelt (z.B. Sub-Gap-Artefakte
                            # ohne CAD-Pendant) und nicht in die Aggregate
                            # aufgenommen.

      voxel_deviation:
        enabled: true
        voxel_size_mm: 5.0
        min_points_per_voxel: 3

      component_registration:
        enabled: true
        split_axis: 1
        split_value: 0.0
        component_a_side: positive
        icp_max_correspondence_distance: 0.5   # eng, da Ausgangslage schon gut
        icp_max_iteration: 50
        icp_anchor_labels: [0, 1, 2]

      # Wurzelspalt-Profil entlang der Naht-Längsrichtung
      # Methodik: lineare Extrapolation der Flanken auf z=0
      gap_profile:
        enabled: true
        flank_a_label: 1
        flank_b_label: 2
        seam_axis: 0              # 0=X (Naht-Längsrichtung im CAD-Koordinatensystem)
        gap_axis: 1               # 1=Y (Spalt-Querrichtung)
        vertical_axis: 2          # 2=Z (Tiefe, Extrapolation auf z=0)
        n_bins: 20
        edge_margin: 10.0         # mm an beiden Enden ausgenommen (Heftpunkte)
        min_points_per_bin: 3


# ── Evaluation ───────────────────────────────────────────────────────────────
# Metriken die nach jedem Lauf berechnet werden
# Status: noch nicht aktiv
# -----------------------------------------------------------------------------
# evaluation:
#   enabled: false
#   metrics:
#     - point_retention_rate   # Preprocessing: wie viele Punkte bleiben
#     - processing_time        # Laufzeit pro Stage
#     - iou_per_class          # Segmentierung: Intersection over Union
#     - overall_accuracy       # Segmentierung: Gesamtgenauigkeit
#   output_file: results/eval_{timestamp}.json